<section class="contact">
  <div class="container">
    <h2>Contact Me</h2>

    <div class="form-container">
      <form id="contactForm" class="form">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" required placeholder="Your name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@email.com">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="6" required placeholder="Your message"></textarea>
        </div>

        <button type="submit" class="sendMessage-btn">Send Message</button>

      </form>
    </div>

    <div id="confirmation" style="display:none; text-align:center; margin-top:20px; color:#64ffda;">
      Message sent successfully.
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
